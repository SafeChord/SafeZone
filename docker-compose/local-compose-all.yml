services:
  # profiles: [infra], core, (seeding) ui

  db:
    image: postgres:17.7
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: safezone
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra

  redis-state:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--requirepass", "5566", "--appendonly", "yes"]
    # ports:
    #   - "6379:6379" # it's not neessary to expose Redis to the host，redis-state only accessed by other services in the compose
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a 5566 --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - infra

  redis-cache:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--requirepass", "5566", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a 5566 --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - infra

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - CLUSTER_ID=hUuu858ZS76ngfyqPwR3CA
      # One broker cannot hold the default replication factor of 3; without these a consumer group never gets its offsets topic.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      # Staging and preview declare covid.case.data with three partitions; the topic the broker auto-creates here matches.
      - KAFKA_NUM_PARTITIONS=3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra

  time-server:
    container_name: time-server
    image: safezone-time-server:${VERSION}
    environment:
      - ENVIRONMENT=DEV
      - REDIS_HOST=redis-state
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5566
      - REDIS_DB=0
      - LOG_LEVEL=INFO
    profiles:
      - toolkit

  cli-relay:
    image: safezone-cli-relay:${VERSION}
    env_file:
      - ../.env.secret
    environment:
      - ENVIRONMENT=DEV
      - DB_URL=postgresql://postgres:password@db:5432/safezone
      - REPLICA_URL=postgresql://postgres:password@db:5432/safezone # Use the same database for simplicity
      - REDIS_HOST=redis-state
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5566
      - REDIS_DB=0
      - CACHE_HOST=redis-cache
      - CACHE_PORT=6379
      - CACHE_PASSWORD=5566
      - SIMULATOR_URL=http://pandemic-simulator:8000
      - INGESTOR_URL=http://data-ingestor:8000
      - ANALYTICS_API_URL=http://analytics-api:8000
      - DASHBOARD_URL=http://dashboard:8080
      - MKDOC_URL=http://mkdocs:8000
      - TIME_SERVER_URL=http://time-server:8000
      - ROLE_FILE=roles.example.yml
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    profiles:
      - toolkit

  cli-daemon:
    image: safezone-cli-command:${VERSION}
    env_file:
      - ../.env.secret
    environment:
      - RELAY_URL=http://cli-relay:8000
      - RELAY_TIMEOUT=3600
    profiles:
      - toolkit

  data-ingestor:
    image: safezone-data-ingestor:${VERSION}
    env_file:
      - ../services/data-ingestor/.env.example
    environment:
      - ENVIRONMENT=DEV
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=covid.case.data
      - LOG_LEVEL=INFO
    profiles:
      - core

  pandemic-simulator:
    image: safezone-pandemic-simulator:${VERSION}
    volumes:
      - ../data/dev:/data
    env_file:
      - ../services/pandemic-simulator/.env.example
    environment:
      - ENVIRONMENT=DEV
      - INGESTOR_URL=http://data-ingestor:8000
      - MAX_CONCURRENT_REQUESTS=20
      - LOG_LEVEL=INFO
    profiles:
      - core

  worker-golang:
    image: safezone-worker:${VERSION}
    env_file:
      - ../services/worker-golang/.env.example
    environment:
      - ENVIRONMENT=STAGING
      - BATCH_SIZE=100
      - FLUSH_INTERVAL=1s
      - KAFKA_BROKER=kafka:9092
      - KAFKA_GROUP_ID=worker-group
      - KAFKA_TOPIC=covid.case.data
      - DB_URL=postgres://postgres:password@db:5432/safezone
      - LOG_LEVEL=INFO
    profiles:
      - core

  analytics-api:
    image: safezone-analytics-api:${VERSION}
    env_file:
      - ../services/analytics-api/.env.example
    environment:
      - ENVIRONMENT=DEV
      - DB_URL=postgresql://postgres:password@db:5432/safezone
      - REDIS_HOST=redis-state
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5566
      - REDIS_DB=0
      - POLL_CACHE_VERSION_INTERVAL=1
      - CACHE_HOST=redis-cache
      - CACHE_PORT=6379
      - CACHE_PASSWORD=5566
      - CACHE_DB=0
      - LOG_LEVEL=DEBUG # cache log at debug level
    profiles:
      - core

  # profiles: infra, core, (seeding) [ui]

  dashboard:
    image: safezone-dashboard:${VERSION}
    ports:
      - "8080:8080"
    env_file:
      - ../services/dashboard/.env.example
    environment:
      - ENVIRONMENT=DEV
      - ANALYTICS_API_URL=http://analytics-api:8000
      - TIME_SERVER_URL=http://time-server:8000
      - LOG_LEVEL=INFO
    profiles:
      - ui

  dashboard-v2:
    image: safezone-dashboard-v2:${VERSION}
    ports:
      - "8081:80"
    volumes:
      - ../services/dashboard-v2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - ui
