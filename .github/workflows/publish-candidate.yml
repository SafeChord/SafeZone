name: Publish Release Candidate Images

# Phase A2: on every push to a `release/*` branch (the frozen pin), publish
# per-sha candidate images to GHCR so the deploy repo's `preview` env has a real
# artifact to validate BEFORE the version tag is cut. The remote tag is the
# frozen product version (from the VERSION file on the release branch) suffixed
# with the commit sha: 0.X.Y-<sha>. The official 0.X.Y tag is assigned by the
# git release tag and promoted digest-identical via crane (release.yml, ADR-1).
# Every release/* push is a deliberate release candidate, so a freight issue is
# always opened (no opt-in) — see the freight step below.

on:
  push:
    branches:
      - 'release/*'

jobs:
  publish-candidate:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up VERSION variables (in-flight product version + sha)
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "VERSION=$SHA" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$(cat VERSION)-$SHA" >> $GITHUB_ENV

      - name: Build Service Images
        run: make build-all

      - name: Build Toolkit Images
        run: make build-tool-all

      - name: Tag and Push all candidate images (0.X.Y-<sha>)
        run: make push-all

      # ── Freight issue (IssueOps): announce the candidate ──
      # A push to release/* IS the deliberate act of cutting a candidate, so the
      # freight issue is always opened (no opt-in label). It opens a deploy-repo
      # issue (the preview work queue); init-deploy posts the automated in-cluster
      # result there but does NOT stamp `validated` — that label is added by the
      # /validate-freight skill only on human GATE 2 sign-off. The release gate
      # requires the label; the release run closes the issue. On a
      # hotfix re-push (A1-pre) the new sha opens a fresh freight and the prior
      # un-validated one is superseded below. Cross-repo write needs the PAT
      # (GITHUB_TOKEN is repo-scoped); failure only warns.
      - name: Open freight issue in the deploy repo
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_REPO: SafeChord/SafeZone-Deploy
        run: |
          TITLE="freight: ${RELEASE_VERSION}"
          EXISTING=$(gh issue list --repo "$DEPLOY_REPO" --label freight --state all \
            --json title --jq '.[].title' || true)
          if echo "$EXISTING" | grep -Fxq "$TITLE"; then
            echo "Freight issue already exists: $TITLE"
            exit 0
          fi
          BODY=$(printf 'Candidate `%s` published to GHCR (all services + cli images).\n\nRun: %s/%s/actions/runs/%s\n\nNext: repoint the preview values to this tag and run init-deploy.yml. A green run adds the `validated` label; the app release gate requires it.' \
            "$RELEASE_VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if ! gh issue create --repo "$DEPLOY_REPO" --label freight \
               --title "$TITLE" --body "$BODY"; then
            echo "::warning::Could not open freight issue '$TITLE' in $DEPLOY_REPO (token lacks cross-repo issues:write?). Open it manually or let init-deploy create it."
            exit 0
          fi
          # Housekeeping: close superseded candidates (open, not yet validated).
          gh issue list --repo "$DEPLOY_REPO" --label freight --state open \
            --json number,title,labels \
            --jq ".[] | select(.title != \"$TITLE\") | select((.labels | map(.name) | contains([\"validated\"])) | not) | .number" \
          | while read -r NUM; do
              gh issue close "$NUM" --repo "$DEPLOY_REPO" \
                --comment "Superseded by \`$TITLE\` (never validated)." || true
            done
