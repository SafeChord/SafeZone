name: PR Quality Check

on:
  pull_request:
    branches:
      - dev
      - 'release/*'
    # A PR whose every changed file is Markdown starts no run, so it has no check.
    # If this check is ever made required, move the skip into the job instead.
    paths-ignore:
      - '**.md'

jobs:
  validation:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List all files
        run: ls -R
      
      - name: Set up dynamic VERSION variable
        run: echo "VERSION=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Verify smoke-fixture consistency across env datasets
        run: make check-data-fixtures

      - name: Run CI (build + test per service)
        run: make ci-all

      - name: Build Toolkit Images
        run: make build-tool-all
      
      - name: Create .env.secret
        run: |
          cat <<EOF > .env.secret
          CLIENT_ID=${{ secrets.CLIENT_ID }}
          CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN=${{ secrets.REFRESH_TOKEN }}
          EOF

      - name: Run End-to-End Smoke Test
        run: make smoke-test